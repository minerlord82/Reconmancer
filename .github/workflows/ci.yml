name: Reconmancer CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run full installation
        run: |
          chmod +x install.sh
          sudo ./install.sh

      - name: Run self-check script
        run: |
          cd /opt/reconmancer
          source venv/bin/activate
          python -m scripts.reconmancer_selfcheck